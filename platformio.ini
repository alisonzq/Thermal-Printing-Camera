; PlatformIO Project Configuration File
;
; Thermal Printer Camera — Freenove ESP32-S3-WROOM CAM (FNK0085)
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; --- Board memory config ---
; 8MB QSPI flash + Octal (OPI) PSRAM, per CLAUDE.md. Change flash_size to
; 16MB if the board turns out to be the 16MB flash variant.
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; huge_app.csv gives more app space (no OTA slot) for the camera + TFT libs.
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB CDC on Boot disabled — matches the Arduino IDE build setting noted
    ; in CLAUDE.md; programming/serial goes over the CH343 USB-UART bridge.
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    ; espressif/esp32-camera            ; step 3 — camera bring-up
    adafruit/Adafruit ILI9341 @ ^1.6
    adafruit/Adafruit GFX Library @ ^1.11
